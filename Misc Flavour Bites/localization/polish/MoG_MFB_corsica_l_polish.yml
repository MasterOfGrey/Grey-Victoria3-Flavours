 mfb_corsica.1.t: "Fundament narodu" #deepl:2859321299
 mfb_corsica.1.d: "Po ponownym uzyskaniu wolności do wyznaczania własnego kursu, musimy określić strukturę naszego nowego narodu. Nasza historia zawiera już szablon, o którym wiemy, że może zadziałać." #deepl:1600458536
 mfb_corsica.1.a: "Przywrócić korsykańską konstytucję!" #deepl:17612752
 mfb_corsica.1.f: "Każdy, kto popełni umyślne zabójstwo lub spowoduje poważne obrażenia przy użyciu jakiejkolwiek broni, będzie winny odebrania życia i jako taki, jeśli zostanie postawiony przed sądem, zostanie stracony jako wróg społeczeństwa." #deepl:1946321614
