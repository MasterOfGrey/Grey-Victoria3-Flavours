 mfb_corsica.1.t: "Bir Ulusun Kuruluşu" #deepl:2859321299
 mfb_corsica.1.d: "Bir kez daha kendi rotamızı çizme özgürlüğünü kazandıktan sonra, yeni ulusumuzun yapısını belirlemeliyiz. Tarihimiz zaten işe yarayabileceğini bildiğimiz bir şablon içeriyor." #deepl:1600458536
 mfb_corsica.1.a: "Korsika Anayasası'nı geri getirin!" #deepl:17612752
 mfb_corsica.1.f: "Herhangi bir silahla kasıtlı cinayet işleyen veya ciddi yaralanmaya neden olan herkes, bir can almaktan suçlu olacak ve bu nedenle, adalete teslim edildiği takdirde, toplum düşmanı olarak idam edilecektir." #deepl:1946321614
