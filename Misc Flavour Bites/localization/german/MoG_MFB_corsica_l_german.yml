 mfb_corsica.1.d: "Da wir nun wieder die Freiheit haben, unseren eigenen Kurs zu bestimmen, müssen wir die Struktur unserer neuen Nation festlegen. Unsere Geschichte enthält bereits eine Vorlage, von der wir wissen, dass sie funktionieren kann." #deepl:1600458536
 mfb_corsica.1.a: "Stellen Sie die korsische Verfassung wieder her!" #deepl:17612752
 mfb_corsica.1.f: "Jeder, der vorsätzliche Tötung oder schwere Körperverletzung mit einer Waffe begeht, macht sich der Tötung eines Menschenlebens schuldig und wird, wenn er vor Gericht gestellt wird, als Feind der Gesellschaft hingerichtet." #deepl:1946321614
