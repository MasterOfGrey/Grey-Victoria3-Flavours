 mfb_corsica.1.t: "La fondation d'une nation" #deepl:2859321299
 mfb_corsica.1.d: "Ayant retrouvé la liberté de tracer notre propre voie, nous devons définir la structure de notre nouvelle nation. Notre histoire contient déjà un modèle dont nous savons qu'il peut fonctionner." #deepl:1600458536
 mfb_corsica.1.a: "Rétablissez la Constitution corse !" #deepl:17612752
 mfb_corsica.1.f: "Celui qui commettra des homicides volontaires, ou blessera gravement avec n'importe quelle arme, sera coupable d'avoir donné la mort, et en tant que tel, s'il tombe aux mains de la justice, sera passé par les armes comme ennemi de la société."
